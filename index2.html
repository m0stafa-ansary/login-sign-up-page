<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form action="#" method="post" class="login-card">
    <div class="start">
    <h1>Create account</h1>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
    </div>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8"  pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
    title="At least 8 characters, with a lowercase letter, an uppercase letter, a number, and a special character" required>

    <label for="confirm">confirm</label>
    <input type="password" id="confirm" name="confirm" placeholder="confirm your password" required>


    <button type="submit" class="submit">Sign up</button>
    <p>Already have an account? <a href="index.html">Login</a></p>
</form>

    <script src="main.js"></script>
</body>
</html>
